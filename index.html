<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Rhuan</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="web-layout">
        <aside class="explorer-bar closed" id="explorer-bar">
            <div class="explorer-button" id="explorer-button">
                <img src="src/img/explorer-icon.svg" alt="">
            </div>
            <div class="archives-content">
                <div class="archives-folder">
                    <img src="src/img/folder-icon.svg" alt="">
                    <span>src/</span>
                </div>
                <div class="archives">
                    <img src="src/img/cmd.svg" alt="">
                    <span>Inicio.cmd</span>
                </div>
                <div class="archives">
                    <img src="src/img/md.svg" alt="">
                    <span>SobreMim.md</span>
                </div>
                <div class="archives">
                    <img src="src/img/json.svg" alt="">
                    <span>Habilidades.json</span>
                </div>
                <div class="archives">
                    <img src="src/img/git.svg" alt="">
                    <span>Projetos.git</span>
                </div>
                <div class="archives">
                    <img src="src/img/log.svg" alt="">
                    <span>Experiencia.log</span>
                </div>
                <div class="archives">
                    <img src="src/img/email.svg" alt="">
                    <span>Contato.email</span>
                </div>
                <div class="line"></div>
            </div>
        </aside>

        <main class="main-content">
            <section class="section" id="home">
                <div class="tab-window">
                    <img src="src/img/cmd.svg" alt="">
                    <span>Inicio.cmd</span>
                </div>
                <div class="window">
                </div>
            </section>

            <section class="section" id="sobre">
                <div class="tab-window">
                    <img src="src/img/md.svg" alt="">
                    <span>SobreMim.md</span>
                </div>
                <div class="window">
                </div>
            </section>

            <section class="section" id="skills">
                <div class="tab-window">
                    <img src="src/img/json.svg" alt="">
                    <span>Habilidades.json</span>
                </div>
                <div class="window">
                </div>
            </section>

            <section class="section" id="projects">
                <div class="tab-window">
                    <img src="src/img/git.svg" alt="">
                    <span>Projetos.git</span>
                </div>
                <div class="window">
                </div>
            </section>

            <section class="section" id="experience">
                <div class="tab-window">
                    <img src="src/img/log.svg" alt="">
                    <span>Experiencia.log</span>
                </div>
                <div class="window">
                </div>
            </section>

            <section class="section" id="contact">
                <div class="tab-window">
                    <img src="src/img/email.svg" alt="">
                    <span>Contato.email</span>
                </div>
                <div class="window">
                </div>
            </section>
        </main>
    </div>

    <script src="src/script.js"></script>
</body>
</html>
